name: CI

on:
  push:
    branches: [main, fix/review-07]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q ai-prediction alerts data-ingestion dashboard digital-twin

      - name: Fault classifier self-test (4 cases)
        run: python ai-prediction/fault_classifier.py --selftest

      - name: Alert engine self-test (grading / workorder)
        run: python alerts/alert_engine.py --selftest

      - name: RUL CI & feeding-caliber self-test
        run: python ai-prediction/evaluate.py --selftest
